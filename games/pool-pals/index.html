<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Pool Pals</title>
<link rel="manifest" href="../../manifest.webmanifest">
<meta name="theme-color" content="#4fc3ff">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="apple-touch-icon" href="../../icons/apple-touch-icon.png">
<link rel="icon" href="../../icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&family=Luckiest+Guy&display=swap" rel="stylesheet">
<style>
:root{
  color-scheme: light;
  --ink:#2b1a4a; --sun:#ffd23f; --pink:#ff5fa2; --sky:#35c6ff; --lime:#6fe04a; --paper:#fffaf2; --orange:#ff8a3d;
  --display:"Luckiest Guy","Baloo 2","Arial Rounded MT Bold","Trebuchet MS",system-ui,sans-serif;
  --body:"Baloo 2","Arial Rounded MT Bold","Trebuchet MS",system-ui,sans-serif;
  --outline: 3px 0 0 var(--ink), -3px 0 0 var(--ink), 0 3px 0 var(--ink), 0 -3px 0 var(--ink), 2px 2px 0 var(--ink), -2px 2px 0 var(--ink), 2px -2px 0 var(--ink), -2px -2px 0 var(--ink);
  --outline-big: 5px 0 0 var(--ink), -5px 0 0 var(--ink), 0 5px 0 var(--ink), 0 -5px 0 var(--ink), 4px 4px 0 var(--ink), -4px 4px 0 var(--ink), 4px -4px 0 var(--ink), -4px -4px 0 var(--ink), 0 10px 0 var(--ink), 4px 9px 0 var(--ink), -4px 9px 0 var(--ink);
}
[hidden]{display:none !important;}
*{box-sizing:border-box;}
html,body{height:100%;margin:0;overflow:hidden;background:#7fd6ff;}
body{position:fixed;inset:0;font-family:var(--body);color:var(--ink);touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;overscroll-behavior:none;-webkit-tap-highlight-color:transparent;}
canvas#game{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;}

.screen{position:fixed;inset:0;z-index:20;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:calc(env(safe-area-inset-top,0px) + 16px) 16px calc(env(safe-area-inset-bottom,0px) + 16px);text-align:center;overflow-y:auto;}
.screen.dim{background:rgba(43,26,74,.45);-webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px);}
#title{pointer-events:none;justify-content:flex-start;padding-top:calc(env(safe-area-inset-top,0px) + 3vh);}
#title button{pointer-events:auto;}
.logo{margin:0;font-family:var(--display);font-weight:400;line-height:.86;letter-spacing:.02em;display:flex;flex-direction:column;align-items:center;text-shadow:var(--outline-big);}
.logo .w1{font-size:min(12vw,15vh);color:var(--sun);transform:rotate(-3deg);}
.logo .w2{font-size:min(15vw,19vh);color:var(--pink);transform:rotate(2deg);animation:wob 2.4s ease-in-out infinite;}
@keyframes wob{0%,100%{transform:rotate(2deg) scale(1)}50%{transform:rotate(-2deg) scale(1.06)}}
.row{display:flex;gap:14px;flex-wrap:wrap;justify-content:center;align-items:center;}
.btn{font-family:var(--display);font-size:clamp(26px,4.2vw,40px);letter-spacing:.05em;line-height:1;color:#fff;background:var(--pink);border:5px solid var(--ink);border-radius:999px;padding:16px 40px 10px;box-shadow:0 8px 0 var(--ink);cursor:pointer;text-shadow:0 3px 0 rgba(43,26,74,.45);transition:transform .08s ease, box-shadow .08s ease;text-decoration:none;display:inline-block;}
.btn:active{transform:translateY(6px);box-shadow:0 2px 0 var(--ink);}
.btn:focus-visible,.stop:focus-visible{outline:5px solid #fff;outline-offset:4px;}
.btn.big{font-size:clamp(44px,7.5vw,76px);padding:22px 76px 14px;background:var(--lime);animation:breathe 1.8s ease-in-out infinite;}
@keyframes breathe{0%,100%{transform:scale(1)}50%{transform:scale(1.05)}}
.btn.big:active{animation:none;}
.btn.sky{background:var(--sky);} .btn.sun{background:var(--sun);color:var(--ink);text-shadow:none;}
.btn.small{font-size:clamp(20px,2.8vw,26px);padding:12px 26px 7px;box-shadow:0 6px 0 var(--ink);}
.head{margin:0;font-family:var(--display);font-weight:400;font-size:clamp(36px,6vw,64px);letter-spacing:.03em;line-height:1;color:#fff;text-shadow:var(--outline-big);}
.linkish{background:none;border:0;color:#fff;text-decoration:underline;font-weight:800;font-size:15px;cursor:pointer;opacity:.85;padding:8px;}
.homebtn,.mapbtn{position:fixed;left:max(16px, env(safe-area-inset-left,0px));top:calc(env(safe-area-inset-top,0px) + 16px);z-index:25;pointer-events:auto;width:68px;height:68px;border-radius:50%;border:5px solid var(--ink);background:var(--sun);box-shadow:0 6px 0 var(--ink);display:grid;place-items:center;cursor:pointer;padding:0;}
.homebtn:active,.mapbtn:active{transform:translateY(5px);box-shadow:0 1px 0 var(--ink);}
.homebtn svg,.mapbtn svg{width:32px;height:32px;}

/* map */
#map{justify-content:flex-start;padding-top:calc(env(safe-area-inset-top,0px) + 18px);}
.path{display:flex;flex-wrap:wrap;justify-content:center;gap:clamp(12px,2.4vw,26px);width:min(980px,100%);margin-top:4px;}
.stop{position:relative;width:clamp(96px,15vw,150px);display:flex;flex-direction:column;align-items:center;gap:4px;background:none;border:0;padding:0;cursor:pointer;font:inherit;color:inherit;}
.stop .disc{position:relative;width:100%;aspect-ratio:1/1;border-radius:50%;border:6px solid var(--ink);background:#fff;box-shadow:0 8px 0 var(--ink);overflow:hidden;display:grid;place-items:center;}
.stop canvas{width:100%;height:100%;}
.stop .n{position:absolute;left:-4px;top:-4px;width:40px;height:40px;border-radius:50%;background:var(--pink);border:4px solid var(--ink);color:#fff;font-family:var(--display);font-size:22px;line-height:40px;display:grid;place-items:center;padding-top:3px;z-index:2;}
.stop .lbl{font-weight:800;font-size:clamp(13px,1.8vw,18px);line-height:1.1;color:#fff;text-shadow:var(--outline);}
.stop.done .disc{background:var(--sun);border-color:var(--ink);}
.stop.done .n{background:var(--lime);}
.stop.next .disc{animation:hop 1.1s ease-in-out infinite;}
@keyframes hop{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
.stop.locked{cursor:default;}
.stop.locked .disc::after{content:"";position:absolute;inset:0;background:rgba(43,26,74,.45);}
.stop:active .disc{transform:translateY(5px);box-shadow:0 3px 0 var(--ink);}

/* in-scene caption */
#cap{position:fixed;z-index:12;top:calc(env(safe-area-inset-top,0px) + 14px);left:50%;transform:translateX(-50%);width:min(760px,calc(100% - 190px));display:flex;align-items:center;gap:10px;background:var(--paper);border:5px solid var(--ink);border-radius:26px;box-shadow:0 7px 0 var(--ink);padding:8px 16px 8px 8px;}
#cap .ct{font-weight:800;font-size:clamp(16px,2.4vw,24px);line-height:1.2;text-align:left;}
@media (max-width:620px){#cap{width:calc(100% - 100px);left:auto;right:12px;transform:none;}}
.speak{display:inline-grid;place-items:center;width:58px;height:58px;border-radius:50%;border:4px solid var(--ink);background:var(--sky);box-shadow:0 5px 0 var(--ink);cursor:pointer;padding:0;flex:none;}
.speak:active{transform:translateY(4px);box-shadow:0 1px 0 var(--ink);}
.speak svg{width:30px;height:30px;}

.card{background:var(--paper);border:6px solid var(--ink);border-radius:36px;box-shadow:0 12px 0 var(--ink);padding:22px clamp(18px,4vw,40px) 26px;display:flex;flex-direction:column;align-items:center;gap:14px;width:min(560px,100%);animation:popin .45s ease;}
.card .head{color:var(--pink);text-shadow:var(--outline), 0 6px 0 var(--ink);}
.card .sub{margin:0;font-weight:800;font-size:clamp(20px,2.8vw,26px);line-height:1.3;max-width:30ch;}
.sticker{width:min(220px,46vw);aspect-ratio:1/1;border-radius:50%;border:7px solid var(--ink);background:var(--sun);box-shadow:0 8px 0 var(--ink);overflow:hidden;animation:stickIn .7s ease;}
.sticker canvas{width:100%;height:100%;}
@keyframes stickIn{0%{transform:scale(0) rotate(-180deg)}70%{transform:scale(1.15) rotate(10deg)}100%{transform:scale(1) rotate(0)}}
@keyframes popin{0%{transform:scale(.6);opacity:0}70%{transform:scale(1.05);opacity:1}100%{transform:scale(1)}}
@media (max-height:560px){.card{padding:14px 20px 18px;gap:10px}.sticker{width:150px}.btn.big{font-size:44px;padding:14px 50px 8px}}
@media (prefers-reduced-motion: reduce){.logo .w2,.btn.big,.stop.next .disc{animation:none;}}
</style>
</head>
<body>
<canvas id="game" aria-label="Pool Pals game"></canvas>

<button class="mapbtn" id="btnMap" hidden aria-label="Back to the map"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 6l6-2 6 2 6-2v14l-6 2-6-2-6 2z" fill="#fff" stroke="#2b1a4a" stroke-width="2" stroke-linejoin="round"/><path d="M9 4v14M15 6v14" stroke="#2b1a4a" stroke-width="2"/></svg></button>
<div id="cap" hidden><button class="speak" id="capSpeak" aria-label="Hear it again"></button><div class="ct" id="capText"></div></div>

<section class="screen" id="title">
  <a class="homebtn" href="../../" aria-label="Back to the arcade"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 11.5 12 4l9 7.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z" fill="#fff" stroke="#2b1a4a" stroke-width="2.2" stroke-linejoin="round"/></svg></a>
  <h1 class="logo"><span class="w1">Pool</span><span class="w2">PALS!</span></h1>
  <div class="row"><button class="btn big" id="btnPlay">PLAY</button></div>
  <div class="row"><button class="btn sun small" id="btnSound">SOUND: ON</button></div>
</section>

<section class="screen dim" id="map" hidden>
  <a class="homebtn" href="../../" aria-label="Back to the arcade"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 11.5 12 4l9 7.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z" fill="#fff" stroke="#2b1a4a" stroke-width="2.2" stroke-linejoin="round"/></svg></a>
  <h2 class="head">Pool Adventure</h2>
  <div class="path" id="path"></div>
  <button class="linkish" id="btnUnlock">Grown-ups: open every stop</button>
</section>

<section class="screen dim" id="reward" hidden>
  <div class="card">
    <h2 class="head" id="rwHead">Sticker!</h2>
    <div class="sticker"><canvas id="rwPic" width="300" height="300"></canvas></div>
    <p class="sub" id="rwText"></p>
    <div class="row"><button class="btn big" id="rwNext">YAY!</button></div>
    <div class="row"><button class="btn sky small" id="rwAgain">AGAIN</button></div>
  </div>
</section>

<script>
(() => {
'use strict';
const $ = id => document.getElementById(id);
const rand = (a, b) => a + Math.random() * (b - a);
const pick = a => a[Math.floor(Math.random() * a.length)];
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const lerp = (a, b, t) => a + (b - a) * t;
const ease = t => t < 0.5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2;
const INK = '#2b1a4a', TAU = Math.PI * 2;

/* ================= save ================= */
const SAVE_KEY = 'poolpals.v1';
let save = { done: {}, sound: true, open: false };
try { const s = JSON.parse(localStorage.getItem(SAVE_KEY)); if (s && typeof s === 'object') save = Object.assign(save, s); } catch (e) {}
function writeSave() { try { localStorage.setItem(SAVE_KEY, JSON.stringify(save)); } catch (e) {} }

/* ================= sound + voice ================= */
let ac = null, master = null;
function audioInit() {
  if (ac) { if (ac.state === 'suspended') ac.resume(); return; }
  try { const AC = window.AudioContext || window.webkitAudioContext; if (!AC) return; ac = new AC(); master = ac.createGain(); master.gain.value = 0.5; master.connect(ac.destination); } catch (e) { ac = null; }
}
function tone(f0, f1, dur, type = 'sine', vol = 0.3, delay = 0) {
  if (!ac || !save.sound) return;
  const t = ac.currentTime + delay, o = ac.createOscillator(), g = ac.createGain();
  o.type = type; o.frequency.setValueAtTime(f0, t); o.frequency.exponentialRampToValueAtTime(Math.max(30, f1), t + dur);
  g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.001, t + dur);
  o.connect(g); g.connect(master); o.start(t); o.stop(t + dur + 0.02);
}
function noise(dur, vol = 0.25, freq = 800, type = 'lowpass') {
  if (!ac || !save.sound) return;
  const n = Math.floor(ac.sampleRate * dur), b = ac.createBuffer(1, n, ac.sampleRate), d = b.getChannelData(0);
  for (let i = 0; i < n; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / n, 1.5);
  const s = ac.createBufferSource(), f = ac.createBiquadFilter(), g = ac.createGain();
  f.type = type; f.frequency.value = freq; g.gain.value = vol; s.buffer = b; s.connect(f); f.connect(g); g.connect(master); s.start();
}
const SFX = {
  tap() { tone(700, 500, 0.06, 'square', 0.08); },
  splash() { noise(0.5, 0.4, 1400); tone(400, 150, 0.2, 'sine', 0.12); },
  click() { tone(1800, 1200, 0.04, 'square', 0.2); tone(900, 700, 0.06, 'square', 0.15, 0.05); },
  whistle() { for (let i = 0; i < 6; i++) tone(2400 + (i % 2) * 300, 2400 + (i % 2) * 300, 0.06, 'sine', 0.12, i * 0.06); },
  quack() { tone(520, 380, 0.12, 'sawtooth', 0.12); tone(480, 340, 0.12, 'sawtooth', 0.1, 0.16); },
  yes() { [523, 659, 784, 1047].forEach((f, i) => tone(f, f, 0.16, 'triangle', 0.22, i * 0.09)); },
  no() { tone(330, 250, 0.3, 'triangle', 0.16); },
  boing() { tone(200, 600, 0.18, 'sine', 0.25); },
  slip() { tone(800, 200, 0.5, 'sine', 0.2); },
  pop() { tone(400, 1200, 0.08, 'sine', 0.25); },
  sparkle() { [1320, 1760, 2093].forEach((f, i) => tone(f, f, 0.1, 'sine', 0.12, i * 0.06)); },
  step() { tone(260, 220, 0.06, 'triangle', 0.15); },
  win() { [523, 659, 784, 659, 784, 1047].forEach((f, i) => tone(f, f, 0.2, 'triangle', 0.22, i * 0.12)); }
};
let voice = null;
function pickVoice() { if (!('speechSynthesis' in window)) return; const vs = speechSynthesis.getVoices() || []; voice = vs.find(v => /en[-_]AU/i.test(v.lang)) || vs.find(v => /en[-_]GB/i.test(v.lang)) || vs.find(v => /^en/i.test(v.lang)) || null; }
if ('speechSynthesis' in window) { pickVoice(); speechSynthesis.onvoiceschanged = pickVoice; }
let sayToken = 0;
function say(text, onend) {
  const my = ++sayToken; let done = false;
  const fin = () => { if (done || my !== sayToken) return; done = true; if (onend) onend(); };
  if (!save.sound || !('speechSynthesis' in window)) { setTimeout(fin, 1200 + text.length * 45); return; }
  try { speechSynthesis.cancel(); const u = new SpeechSynthesisUtterance(text); if (voice) u.voice = voice; u.lang = voice ? voice.lang : 'en-AU'; u.rate = 0.88; u.pitch = 1.15; u.onend = fin; u.onerror = fin; speechSynthesis.speak(u); } catch (e) {}
  setTimeout(fin, 2500 + text.length * 90);
}
function hush() { sayToken++; try { if ('speechSynthesis' in window) speechSynthesis.cancel(); } catch (e) {} }
let capLast = '';
function talk(text, cb) { capLast = text; $('capText').textContent = text; $('cap').hidden = false; say(text, cb); }

/* ================= canvas ================= */
const cv = $('game'), cx = cv.getContext('2d');
const VH = 600; let VW = 800, K = 1, DPR = 1, CX = 400, SP = 400, SC = 1;
function resize() {
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  const w = window.innerWidth, h = window.innerHeight;
  cv.width = Math.round(w * DPR); cv.height = Math.round(h * DPR);
  K = h / VH; VW = w / K; CX = VW / 2; SP = Math.min(VW, 900) / 2; SC = clamp(VW / 900, 0.6, 1);
}
window.addEventListener('resize', resize); resize();

/* ================= drawing primitives ================= */
function rr(c, x, y, w, h, r) { r = Math.min(r, w / 2, h / 2); c.beginPath(); c.moveTo(x + r, y); c.arcTo(x + w, y, x + w, y + h, r); c.arcTo(x + w, y + h, x, y + h, r); c.arcTo(x, y + h, x, y, r); c.arcTo(x, y, x + w, y, r); c.closePath(); }
function ell(c, x, y, rx, ry, rot = 0) { c.beginPath(); c.ellipse(x, y, Math.max(0.1, rx), Math.max(0.1, ry), rot, 0, TAU); }
function fs(c, fill, lw = 4) { if (fill) { c.fillStyle = fill; c.fill(); } if (lw) { c.lineWidth = lw; c.strokeStyle = INK; c.lineJoin = 'round'; c.stroke(); } }
function text(c, s, x, y, size, col = '#fff', lw = 6) { c.font = `${size}px "Luckiest Guy", system-ui`; c.textAlign = 'center'; c.textBaseline = 'middle'; c.lineWidth = lw; c.strokeStyle = INK; c.lineJoin = 'round'; c.strokeText(s, x, y); c.fillStyle = col; c.fillText(s, x, y); }
function stud(c, x, y, col) { rr(c, x - 8, y - 9, 16, 10, 3); fs(c, col, 3); ell(c, x, y - 9, 8, 3); c.fillStyle = 'rgba(255,255,255,.45)'; c.fill(); c.lineWidth = 2; c.strokeStyle = INK; c.stroke(); }
function shade(hex, f) { const n = parseInt(hex.slice(1), 16); let r = n >> 16, g = (n >> 8) & 255, b = n & 255; r = clamp(Math.round(r * f), 0, 255); g = clamp(Math.round(g * f), 0, 255); b = clamp(Math.round(b * f), 0, 255); return '#' + ((1 << 24) | (r << 16) | (g << 8) | b).toString(16).slice(1); }

/* ---- brick-built characters (original designs), front view, feet at (x,y) ---- */
const CH = {
  pip:   { name: 'Pip', body: '#ffb43d', face: '#ffe2a6', ear: '#a8642a', earType: 'flop', nose: '#4a2a1a', trunks: '#35c6ff' },
  ollie: { name: 'Ollie', body: '#9a6a42', face: '#f3dcb8', ear: '#7a4f2e', earType: 'round', nose: '#3a2416', shirt: '#ff3b3b', band: '#ffd23f', whistle: true, whiskers: true, trunks: '#ffd23f' },
  bo:    { name: 'Bo', body: '#c9a8ff', face: '#f6efff', ear: '#c9a8ff', earIn: '#ffb3d1', earType: 'long', nose: '#ff7aa2', trunks: '#ff8a3d' },
};
function drawBrick(c, id, x, y, s, o = {}) {
  const P = CH[id], t = o.t != null ? o.t : G.t;
  c.save(); c.translate(x, y); c.scale(s * (o.flip ? -1 : 1), s); if (o.rot) c.rotate(o.rot);
  const dark = shade(P.body, 0.8);
  // legs
  const legs = o.legs || 'stand';
  const legDraw = (sx) => {
    c.save();
    if (legs === 'out') { c.translate(sx * 12, -34); c.rotate(sx * -(o.legOut || 0) * 0.7); c.translate(-sx * 12, 34); }
    let lift = 0;
    if (legs === 'walk') lift = Math.max(0, Math.sin((o.walkPh || 0) + (sx > 0 ? Math.PI : 0))) * 8;
    if (legs === 'sit') { rr(c, sx > 0 ? 4 : -24, -26, 20, 22, 6); fs(c, P.body, 3.5); rr(c, sx > 0 ? 2 : -26, -8, 24, 12, 5); fs(c, dark, 3.5); }
    else { rr(c, sx > 0 ? 4 : -24, -36 - lift, 20, 34, 6); fs(c, P.body, 3.5); rr(c, sx > 0 ? 2 : -26, -10 - lift, 24, 12, 5); fs(c, dark, 3.5); }
    c.restore();
  };
  legDraw(-1); legDraw(1);
  // arms (behind body when down)
  const arm = (sx, a) => {
    c.save(); c.translate(sx * 27, -82); c.rotate(-sx * a);
    const sleeve = o.rash ? '#35c6ff' : (P.shirt || P.body);
    rr(c, -8, -2, 16, 40, 7); fs(c, P.body, 3.5);
    rr(c, -8, -2, 16, 16, 6); fs(c, sleeve, 3.5);
    ell(c, 0, 42, 9, 9); fs(c, P.face, 3.5);
    c.restore();
  };
  const aL = o.armL != null ? o.armL : 0.15, aR = o.armR != null ? o.armR : 0.15;
  if (aL <= 1.9) arm(-1, aL); if (aR <= 1.9) arm(1, aR);
  // body
  const torso = o.rash ? '#35c6ff' : (P.shirt || P.body);
  rr(c, -30, -90, 60, 58, 12); fs(c, torso, 4);
  if (!P.shirt && !o.rash) { ell(c, 0, -60, 18, 16); c.fillStyle = P.face; c.fill(); }
  if (P.shirt) { c.fillStyle = P.band; c.fillRect(-28, -70, 56, 10); c.lineWidth = 3; c.strokeStyle = INK; c.strokeRect(-28, -70, 56, 10); }
  if (o.rash) { c.fillStyle = '#fff'; c.fillRect(-28, -72, 56, 7); }
  rr(c, -31, -46, 62, 16, 5); fs(c, P.trunks, 3.5);
  if (P.whistle) { c.beginPath(); c.moveTo(-14, -90); c.lineTo(0, -72); c.lineTo(14, -90); c.lineWidth = 2.5; c.strokeStyle = '#fff'; c.stroke(); rr(c, -6, -76, 14, 9, 3); fs(c, '#c0c0c8', 2.5); }

    if (S.ph === 'choose') {
      const k = cardHit(S, x, y); if (k < 0) return;
      const good = (k === 1) !== S.swap;
      if (!good) { wrongCard(k, 'Jumping in could make two friends in trouble. Kids shout for a grown-up!'); return; }
      S.cardState[k] = 'right'; S.ph = 'chose'; S.lock = true; SFX.yes();
      setTimeout(() => { S.cardState = []; S.ph = 'shout'; S.bigT = 2.2; SFX.whistle(); }, 900);
      talk('Yes! Shout loud for a grown-up! Help! Help!', () => {
        S.ph = 'rescue';
        setTimeout(() => {
          const b = this.bo();
          S.ring = { u: 0, dur: 1.1, x0: P.x + P.w - 30, y0: 300, x1: b.x, y1: b.y - 40, arc: 120, cb: () => { SFX.splash(); splashFX(b.x, b.y - 30, 14); S.ring.held = true;
            talk('Ollie threw a float ring. Bo holds on tight, and Ollie pulls Bo to the side.', () => { S.ph = 'safe'; setTimeout(() => { S.ph = 'practice'; talk('Bo is safe! Thanks, Pip! Now let\'s practise a big shout. Tap the megaphone three times!', () => { S.lock = false; }); }, 1800); });
          } };
        }, 1300);
      });
      return;
    }
    if (S.ph === 'practice') {
      const m = this.mega(); if (Math.hypot(x - m.x, y - m.y) > m.r + 10) return;
      S.practice++; S.shout = S.practice; S.bigT = 1.2; tone(300 + S.practice * 120, 500 + S.practice * 150, 0.3, 'sawtooth', 0.12); say(['Help!', 'Help, help!', 'Help! Grown-up!'][S.practice - 1]);
      sparkleFX(m.x, m.y - 40, 10);
      if (S.practice >= 3) { S.lock = true; setTimeout(() => talk('Great shouting! If a friend needs help in the water, shout for a grown-up!', done), 1300); }
    }
  }
};
/* ---------- 8: pool party ---------- */
SCENES[8] = {
  start(S) { S.balls = []; S.recap = 0; S.recapT = 0; S.star = false;
    talk('It\'s a pool party! Ollie the grown-up is watching. Tap the pool to splash!', () => { S.lock = false; S.recapOn = true; S.recapT = 1.5; }); },
  update(S, dt) {
    S.balls.forEach(b => { b.vy += 600 * dt; b.x += b.vx * dt; b.y += b.vy * dt; b.rot += b.vx * dt * 0.02; if (b.y > b.floor) { b.y = b.floor; b.vy *= -0.6; if (Math.abs(b.vy) < 60) b.vy = 0; b.vx *= 0.98; } });
    S.balls = S.balls.filter(b => b.x > -60 && b.x < VW + 60);
    if (S.recapOn && !S.star) { S.recapT -= dt; if (S.recapT <= 0 && !S.talking) { if (S.recap < 8) { const i = S.recap; S.recap++; S.talking = true; SFX.sparkle(); talk(STOPS[i].rule, () => { S.talking = false; S.recapT = 0.6; }); } else { S.star = true; SFX.win(); for (let k = 0; k < 4; k++) setTimeout(() => sparkleFX(rand(100, VW - 100), rand(150, 350), 20), k * 250); talk('You know all the pool safety rules. You\'re a Pool Safety Star!', () => setTimeout(done, 1500)); } } }
  },
  draw(c, S, t) {
    const P = poolRect(); yard(c, t, P);
    // lifeguard chair
    const lx = Math.min(P.x + P.w + 10, VW - 50);
    c.lineWidth = 8; c.strokeStyle = INK; c.beginPath(); c.moveTo(lx - 30, 400); c.lineTo(lx - 20, 290); c.moveTo(lx + 30, 400); c.lineTo(lx + 20, 290); c.stroke(); c.lineWidth = 4; c.strokeStyle = '#fff'; c.stroke();
    rr(c, lx - 34, 280, 68, 14, 5); fs(c, '#ff3b3b', 3.5);
    drawBrick(c, 'ollie', lx, 290, 0.6 * SC, { hat: '#ffd23f', sunnies: true, legs: 'sit', armR: Math.sin(t * 2) > 0.7 ? 2.6 : 0.3 });
    const swim = (id, fx, ph, sc) => { const x = P.x + P.w * fx + Math.sin(t * 0.6 + ph) * P.w * 0.08, y = P.y + 110 + Math.sin(t * 3 + ph) * 4; drawBrick(c, id, x, y, sc * SC, { armL: 1.9 + Math.sin(t * 6 + ph) * 0.4, armR: 1.9 - Math.sin(t * 6 + ph) * 0.4, mouth: 'open', eyes: 'happy', rash: id === 'pip' }); };
    swim('pip', 0.3, 0, 0.75); swim('bo', 0.62, 2, 0.7);
    drawDuck(c, P.x + P.w * 0.47 + Math.sin(t * 0.8) * 30, P.y + 40, 0.7 * SC, { face: Math.cos(t * 0.8) > 0 ? 1 : -1 });
    waterFront(c, P.x, P.y, P.w, P.h, t, 0.5, 48);
    S.balls.forEach(b => drawBall(c, b.x, b.y, 22, b.rot));
    G.ripples.forEach(r => { c.lineWidth = 3; c.strokeStyle = `rgba(255,255,255,${1 - r.life})`; ell(c, r.x, r.y, 10 + r.life * 70, 4 + r.life * 20); c.stroke(); });
    // sticker parade
    const n = 8, size = Math.min(58, (VW - 120) / n - 8);
    for (let k = 0; k < n; k++) {
      const x = CX - (n - 1) * (size + 8) / 2 + k * (size + 8), y = 120;
      ell(c, x, y + 4, size / 2, size / 2); c.fillStyle = INK; c.fill();
      ell(c, x, y, size / 2, size / 2); fs(c, k < S.recap ? '#ffd23f' : 'rgba(255,255,255,.6)', 4);
      if (k < S.recap) { c.save(); c.beginPath(); c.arc(x, y, size / 2 - 3, 0, TAU); c.clip(); c.translate(x - size / 2, y - size / 2); iconFor(c, k, size, size); c.restore(); ell(c, x, y, size / 2, size / 2); c.lineWidth = 4; c.strokeStyle = INK; c.stroke(); }
    }
    if (S.star) { const p = 1 + Math.sin(t * 4) * 0.05; c.save(); c.translate(CX, 260); c.scale(p, p); drawTrophy(c, 0, 20, 1.2); c.restore(); text(c, 'POOL SAFETY STAR!', CX, 330, 34, '#ffd23f', 8); }
  },
  tap(S, x, y) {
    const P = poolRect();
    SFX.splash(); splashFX(x, Math.max(y, P.y + 10), 14); ripple(x, Math.max(y, P.y + 20));
    if (S.balls.length < 6) S.balls.push({ x, y: Math.min(y, P.y + 60), vx: rand(-120, 120), vy: -rand(300, 480), rot: 0, floor: P.y + 70 + rand(0, 40) });
  }
};

/* ================= flow ================= */
function show(id) { ['title', 'map', 'reward'].forEach(s => { $(s).hidden = s !== id; }); }
function setSoundLabel() { $('btnSound').textContent = 'SOUND: ' + (save.sound ? 'ON' : 'OFF'); }
function unlockedUpTo() { if (save.open) return STOPS.length; let n = 0; while (n < STOPS.length && save.done[n]) n++; return Math.min(STOPS.length, n + 1); }
function openMap() {
  hush(); S = null; G.state = 'map'; $('cap').hidden = true; $('btnMap').hidden = true;
  const path = $('path'); path.innerHTML = '';
  const up = unlockedUpTo();
  STOPS.forEach((st, i) => {
    const locked = i >= up, isDone = !!save.done[i], isNext = !isDone && !locked && (i === up - 1 || save.open && !save.done[i] && i === STOPS.findIndex((_, j) => !save.done[j]));
    const b = document.createElement('button'); b.className = 'stop' + (isDone ? ' done' : '') + (locked ? ' locked' : '') + (isNext ? ' next' : '');
    b.setAttribute('aria-label', `${st.name}${locked ? ', locked' : ''}`);
    b.innerHTML = `<div class="disc"><span class="n">${i + 1}</span></div><div class="lbl">${st.name}</div>`;
    const pc = document.createElement('canvas'); pc.width = 240; pc.height = 240; b.querySelector('.disc').appendChild(pc);
    iconFor(pc.getContext('2d'), i, 240, 240);
    b.onclick = () => { audioInit(); if (locked) { SFX.no(); say('Finish the stop before this one first!'); return; } SFX.tap(); startStop(i); };
    path.appendChild(b);
  });
  show('map');
  if (!Object.keys(save.done).length) say('Pick a stop on the map to start your pool adventure!');
}
function startStop(i) {
  hush(); show(null); G.state = 'scene'; G.parts = []; G.ripples = [];
  S = { i, t: 0, lock: true };
  $('btnMap').hidden = false;
  SCENES[i].start(S);
}
function showReward(i) {
  if (!S || S.i !== i) return;
  save.done[i] = true; writeSave();
  G.state = 'reward'; $('cap').hidden = true; $('btnMap').hidden = true;
  iconFor($('rwPic').getContext('2d'), i, 300, 300);
  const last = i === STOPS.length - 1;
  $('rwHead').textContent = last ? 'Super star!' : 'Sticker!';
  $('rwText').textContent = STOPS[i].rule;
  show('reward'); SFX.win();
  say(last ? 'You finished the whole pool adventure! Super star!' : 'You got a sticker! ' + STOPS[i].rule);
  $('rwNext').onclick = () => { SFX.tap(); openMap(); };
  $('rwAgain').onclick = () => { SFX.tap(); startStop(i); };
}

/* ================= input ================= */
function toV(e) { const r = cv.getBoundingClientRect(); return { x: (e.clientX - r.left) / K, y: (e.clientY - r.top) / K }; }
cv.addEventListener('pointerdown', e => {
  audioInit(); e.preventDefault();
  const p = toV(e);
  G.taps.push({ x: p.x, y: p.y, life: 0 });
  if (G.state === 'scene' && S && !S.lock && !S.finished) SCENES[S.i].tap(S, p.x, p.y);
});
G.taps = [];
$('btnMap').onclick = () => { SFX.tap(); openMap(); };
$('capSpeak').innerHTML = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 9v6h4l5 4V5L7 9z" fill="#fff" stroke="#2b1a4a" stroke-width="2" stroke-linejoin="round"/><path d="M16 8.5a5 5 0 0 1 0 7M18.5 6a8.5 8.5 0 0 1 0 12" fill="none" stroke="#2b1a4a" stroke-width="2.2" stroke-linecap="round"/></svg>';
$('capSpeak').onclick = () => { if (capLast) say(capLast); };
$('btnPlay').onclick = () => { audioInit(); SFX.tap(); say(' '); openMap(); };
$('btnSound').onclick = () => { save.sound = !save.sound; writeSave(); setSoundLabel(); if (!save.sound) hush(); else { audioInit(); SFX.tap(); } };
$('btnUnlock').onclick = () => { save.open = true; writeSave(); openMap(); };
setSoundLabel();

/* ================= loop ================= */
function update(dt) {
  G.t += dt;
  if (S && G.state === 'scene') { S.t += dt; const sc = SCENES[S.i]; if (sc.update) sc.update(S, dt); }
  for (let i = G.parts.length - 1; i >= 0; i--) { const p = G.parts[i]; p.life += dt; if (p.life > p.max) { G.parts.splice(i, 1); continue; } p.vy += p.g * dt; p.x += p.vx * dt; p.y += p.vy * dt; }
  for (let i = G.ripples.length - 1; i >= 0; i--) { const r = G.ripples[i]; r.life += dt * 0.8; if (r.life >= 1) G.ripples.splice(i, 1); }
  for (let i = G.taps.length - 1; i >= 0; i--) { G.taps[i].life += dt; if (G.taps[i].life > 0.35) G.taps.splice(i, 1); }
}
function drawTitleScene(c, t) {
  const P = poolRect(); yard(c, t, P);
  drawUmbrella(c, P.x + 30, 400, 0.9 * SC, 1);
  drawBrick(c, 'pip', P.x + P.w * 0.38, P.y + 110 + Math.sin(t * 3) * 4, 0.8 * SC, { armL: 1.9 + Math.sin(t * 6) * 0.3, armR: 2.6, mouth: 'open', eyes: 'happy', rash: true });
  drawBrick(c, 'bo', P.x + P.w * 0.62, P.y + 110 + Math.sin(t * 3 + 1) * 4, 0.75 * SC, { armL: 2.6, armR: 1.9 + Math.sin(t * 6) * 0.3, mouth: 'open' });
  waterFront(c, P.x, P.y, P.w, P.h, t, 0.5, 52);
  drawBrick(c, 'ollie', Math.min(P.x + P.w - 20, VW - 50), 400, 0.8 * SC, { hat: '#ffd23f', sunnies: true, armR: 2.6 + Math.sin(t * 5) * 0.2 });
  drawDuck(c, P.x + P.w * 0.15, 400, 1.2 * SC, { face: 1 });
}
function render() {
  const c = cx; c.setTransform(1, 0, 0, 1, 0, 0); c.clearRect(0, 0, cv.width, cv.height);
  c.setTransform(K * DPR, 0, 0, K * DPR, 0, 0);
  const t = G.t;
  if (G.state === 'scene' && S) SCENES[S.i].draw(c, S, t);
  else drawTitleScene(c, t);
  G.parts.forEach(p => { c.globalAlpha = clamp((1 - p.life / p.max) * 1.6, 0, 1); if (p.star) drawStarfish(c, p.x, p.y, p.r, p.col, p.life * 4); else { ell(c, p.x, p.y, p.r, p.r); c.fillStyle = p.col; c.fill(); } c.globalAlpha = 1; });
  G.taps.forEach(r => { c.lineWidth = 5; c.strokeStyle = `rgba(255,255,255,${1 - r.life / 0.35})`; ell(c, r.x, r.y, 12 + r.life * 90, 12 + r.life * 90); c.stroke(); });
}
let last = performance.now();
function frame(now) { const dt = Math.min(0.05, (now - last) / 1000); last = now; update(dt); render(); requestAnimationFrame(frame); }
show('title'); requestAnimationFrame(frame);
document.addEventListener('visibilitychange', () => { if (document.hidden) hush(); });

window.__zpt = { G, get S() { return S; }, SCENES, STOPS, save, startStop, openMap, step(n, dt) { for (let k = 0; k < n; k++) update(dt || 0.05); render(); }, render, tap(x, y) { if (S && !S.lock) SCENES[S.i].tap(S, x, y); } };
})();
</script>
