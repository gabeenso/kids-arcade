  <circle cx="236" cy="146" r="9" fill="#ff7aa8"/><circle cx="228" cy="158" r="9" fill="#ffa66b"/><circle cx="222" cy="171" r="9" fill="#ffe066"/><circle cx="217" cy="184" r="8.5" fill="#8ee89a"/><circle cx="213" cy="197" r="8" fill="#7cc8ff"/><circle cx="244" cy="140" r="7" fill="#b79bff"/>
