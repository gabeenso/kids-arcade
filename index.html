<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Kids Arcade</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#4fc3ff">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Arcade">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@700;800&family=Luckiest+Guy&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#2b1a4a; --sun:#ffd23f; --pink:#ff5fa2; --sky:#4fc3ff; --lime:#6fe04a; --paper:#fffaf2;
  --display:"Luckiest Guy","Baloo 2","Arial Rounded MT Bold","Trebuchet MS",system-ui,sans-serif;
  --body:"Baloo 2","Arial Rounded MT Bold","Trebuchet MS",system-ui,sans-serif;
  --outline: 3px 0 0 var(--ink), -3px 0 0 var(--ink), 0 3px 0 var(--ink), 0 -3px 0 var(--ink), 2px 2px 0 var(--ink), -2px 2px 0 var(--ink), 2px -2px 0 var(--ink), -2px -2px 0 var(--ink);
  --outline-big: 5px 0 0 var(--ink), -5px 0 0 var(--ink), 0 5px 0 var(--ink), 0 -5px 0 var(--ink), 4px 4px 0 var(--ink), -4px 4px 0 var(--ink), 4px -4px 0 var(--ink), -4px -4px 0 var(--ink), 0 10px 0 var(--ink);
  color-scheme: light;
}
*{box-sizing:border-box;}
html,body{margin:0;min-height:100%;}
body{
  font-family:var(--body);color:var(--ink);
  background:linear-gradient(180deg,#4fc3ff 0%,#9fe3ff 55%,#c9f2ff 100%) fixed;
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;
  padding:calc(env(safe-area-inset-top,0px) + 20px) max(16px, env(safe-area-inset-right,0px)) calc(env(safe-area-inset-bottom,0px) + 28px) max(16px, env(safe-area-inset-left,0px));
  overflow-x:hidden;
}
.clouds{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden;}
.cloud{position:absolute;width:180px;height:60px;background:#fff;border-radius:60px;opacity:.9;animation:drift linear infinite;}
.cloud::before,.cloud::after{content:"";position:absolute;background:#fff;border-radius:50%;}
.cloud::before{width:80px;height:80px;left:25px;top:-38px;}
.cloud::after{width:60px;height:60px;left:90px;top:-26px;}
@keyframes drift{from{transform:translateX(-260px)}to{transform:translateX(calc(100vw + 260px))}}
.ground{position:fixed;left:-10%;right:-10%;bottom:-120px;height:260px;border-radius:50% 50% 0 0;background:#7ed957;border-top:6px solid #5fc244;z-index:0;}
main{position:relative;z-index:1;max-width:1100px;margin:0 auto;display:flex;flex-direction:column;align-items:center;gap:clamp(16px,3vh,28px);}
h1{margin:0;padding-top:.18em;font-family:var(--display);font-weight:400;font-size:clamp(56px,11vw,120px);line-height:.9;letter-spacing:.03em;color:var(--sun);text-shadow:var(--outline-big);text-align:center;}
h1 span{display:inline-block;animation:bob 2.4s ease-in-out infinite;}
h1 span:nth-child(2n){color:var(--pink);animation-delay:.2s}
h1 span:nth-child(3n){color:var(--lime);animation-delay:.4s}
@keyframes bob{0%,100%{transform:translateY(0) rotate(-2deg)}50%{transform:translateY(-8px) rotate(2deg)}}
.sub{margin:0;font-weight:800;font-size:clamp(18px,2.6vw,26px);color:#fff;text-shadow:var(--outline);text-align:center;}
.grid{width:100%;display:grid;grid-template-columns:repeat(auto-fit,minmax(min(300px,100%),360px));justify-content:center;gap:clamp(16px,2.6vw,28px);}
.card{
  display:flex;flex-direction:column;text-decoration:none;color:inherit;background:var(--paper);
  border:6px solid var(--ink);border-radius:32px;box-shadow:0 10px 0 var(--ink);overflow:hidden;cursor:pointer;
  transition:transform .1s ease, box-shadow .1s ease;animation:popin .45s ease backwards;font:inherit;padding:0;text-align:left;
}
.card:active{transform:translateY(8px);box-shadow:0 2px 0 var(--ink);}
.card:focus-visible{outline:6px solid #fff;outline-offset:4px;}
@keyframes popin{0%{transform:scale(.6);opacity:0}70%{transform:scale(1.05);opacity:1}100%{transform:scale(1)}}
.cover{position:relative;aspect-ratio:4/3;width:100%;max-width:100%;border-bottom:6px solid var(--ink);overflow:hidden;}
.cover img{display:block;width:100%;height:100%;object-fit:cover;}
.info{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 18px 16px;}
.title{font-family:var(--display);font-size:clamp(24px,3vw,32px);letter-spacing:.03em;line-height:1;}
.tag{font-weight:800;font-size:16px;opacity:.75;margin-top:4px;}
.play{flex:0 0 auto;display:grid;place-items:center;width:64px;height:64px;border-radius:50%;background:var(--lime);border:5px solid var(--ink);box-shadow:0 5px 0 var(--ink);}
.play svg{width:26px;height:26px;margin-left:4px;}
.card.soon .play{background:#e6dcff;}
.card.soon .play svg{margin-left:0;}
.card.soon .cover::after{content:"COMING SOON";position:absolute;right:-46px;top:26px;transform:rotate(35deg);background:var(--sun);border-block:4px solid var(--ink);font-family:var(--display);font-size:18px;letter-spacing:.05em;padding:6px 60px 2px;}
.card.wiggle{animation:wiggle .5s ease;}
@keyframes wiggle{0%,100%{transform:rotate(0)}25%{transform:rotate(-3deg)}75%{transform:rotate(3deg)}}
.note{position:relative;z-index:1;margin:8px auto 0;max-width:40ch;text-align:center;font-weight:700;font-size:14px;color:var(--ink);opacity:.7;}
.empty{font-weight:800;font-size:20px;background:var(--paper);border:5px solid var(--ink);border-radius:24px;padding:16px 22px;}
@media (prefers-reduced-motion: reduce){h1 span,.cloud,.card{animation:none;}}
</style>
</head>
<body>
<div class="clouds" aria-hidden="true">
  <div class="cloud" style="top:12%;animation-duration:70s;animation-delay:-20s"></div>
  <div class="cloud" style="top:30%;animation-duration:95s;animation-delay:-60s;transform:scale(.7)"></div>
  <div class="cloud" style="top:52%;animation-duration:80s;animation-delay:-5s"></div>
</div>
<div class="ground" aria-hidden="true"></div>
<main>
  <h1 aria-label="Arcade"><span>A</span><span>R</span><span>C</span><span>A</span><span>D</span><span>E</span></h1>
  <p class="sub">Pick a game!</p>
  <div class="grid" id="grid"></div>
</main>
<p class="note" id="note"></p>
<script>
(function () {
  var PLAY = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 3.5v17l14-8.5z" fill="#2b1a4a" stroke="#2b1a4a" stroke-width="2" stroke-linejoin="round"/></svg>';
  var LOCK = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2l2.6 6.3 6.8.5-5.2 4.4 1.6 6.6L12 16.3l-5.8 3.5 1.6-6.6-5.2-4.4 6.8-.5z" fill="#ffd23f" stroke="#2b1a4a" stroke-width="2" stroke-linejoin="round"/></svg>';
  var grid = document.getElementById('grid');
  function esc(s) { return String(s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
  function render(games) {
    if (!games.length) { grid.innerHTML = '<div class="empty">No games yet!</div>'; return; }
    grid.innerHTML = games.map(function (g, i) {
      var soon = !!g.comingSoon;
      var inner = '<div class="cover" style="background:' + esc(g.color || '#ffd23f') + '">' + (g.cover ? '<img src="' + esc(g.cover) + '" alt="">' : '') + '</div>' +
        '<div class="info"><div><div class="title">' + esc(g.title) + '</div><div class="tag">' + esc(g.tagline || '') + '</div></div>' +
        '<span class="play">' + (soon ? LOCK : PLAY) + '</span></div>';
      var style = ' style="animation-delay:' + (i * 0.08) + 's"';
      return soon
        ? '<button class="card soon" type="button" aria-label="' + esc(g.title) + ', coming soon"' + style + '>' + inner + '</button>'
        : '<a class="card" href="' + esc(g.path) + '" aria-label="Play ' + esc(g.title) + '"' + style + '>' + inner + '</a>';
    }).join('');
    Array.prototype.forEach.call(grid.querySelectorAll('.card.soon'), function (b) {
      b.addEventListener('click', function () { b.classList.remove('wiggle'); void b.offsetWidth; b.classList.add('wiggle'); });
    });
  }
  fetch('games.json', { cache: 'no-store' })
    .then(function (r) { if (!r.ok) throw new Error(r.status); return r.json(); })
    .then(function (d) { render(d.games || []); })
    .catch(function () { grid.innerHTML = '<div class="empty">The games did not load. Check the internet and pull down to refresh.</div>'; });
  var standalone = window.matchMedia('(display-mode: standalone)').matches || window.matchMedia('(display-mode: fullscreen)').matches || window.navigator.standalone;
  if (!standalone) document.getElementById('note').textContent = 'Grown-ups: tap Share, then "Add to Home Screen" to open the arcade full screen like an app.';
})();
</script>
</body>
</html>
